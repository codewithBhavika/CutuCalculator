<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Calculator 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffe8f0, #ffdbe8);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
  }

  /* Calculator Card */
  .calculator {
    width: 300px;
    background: #fff5fa;
    border-radius: 34px;
    padding: 22px;
    box-shadow:
      0 35px 70px rgba(255, 105, 180, 0.35),
      inset 0 3px 4px rgba(255,255,255,0.95);
    position: relative;
  }

  .title {
    font-family: 'Pacifico', cursive;
    text-align: center;
    font-size: 24px;
    color: #ff5f9e;
    margin-bottom: 12px;
  }

  /* Display */
  .display {
    height: 56px;
    background: #ffffff;
    border-radius: 18px;
    margin-bottom: 18px;
    padding: 12px 16px;
    font-size: 24px;
    color: #ff5f9e;
    text-align: right;
    box-shadow:
      inset 6px 6px 12px rgba(0,0,0,0.08),
      inset -6px -6px 12px rgba(255,255,255,1);
  }

  /* Grid */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  /* Marshmallow Button */
  button {
    height: 54px;
    border-radius: 20px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #ff5f9e;
    background: #fff;
    position: relative;

    box-shadow:
      8px 8px 18px rgba(0,0,0,0.12),
      -8px -8px 18px rgba(255,255,255,0.95);
    transition: all 0.15s ease;
  }

  /* tiny flower on buttons */
  button::after {
    content: "🌸";
    font-size: 10px;
    position: absolute;
    bottom: 6px;
    right: 8px;
    opacity: 0.6;
  }

  button:active {
    transform: scale(0.93);
    box-shadow:
      inset 6px 6px 12px rgba(0,0,0,0.15),
      inset -6px -6px 12px rgba(255,255,255,0.9);
  }

  /* Operators */
  .operator {
    background: #ffe1ec;
    font-weight: 600;
  }

  /* Clear */
  .clear {
    grid-column: span 2;
    background: #ffffff;
    font-weight: 600;
  }

  /* Equal */
  .equal {
    grid-column: span 2;
    background: linear-gradient(135deg, #ff5f9e, #ff85b3);
    color: white;
    font-size: 20px;
    box-shadow: 0 14px 26px rgba(255,95,158,0.5);
  }

  .equal::after {
    content: "💖";
    font-size: 12px;
  }

  /* Decorative flowers */
  .flower {
    position: absolute;
    font-size: 18px;
    opacity: 0.5;
  }

  .f1 { top: 10px; right: 14px; }
  .f2 { bottom: 18px; left: 16px; }
</style>
</head>

<body>

<div class="calculator">
  <div class="flower f1">🌸</div>
  <div class="flower f2">🌼</div>

  <div class="title">Cute Calculator 💕</div>

  <div class="display" id="display">0</div>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="append('/')">÷</button>
    <button class="operator" onclick="append('*')">×</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('-')">−</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('.')">.</button>

    <button onclick="append('0')">0</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById("display");

  function append(value) {
    display.innerText === "0"
      ? display.innerText = value
      : display.innerText += value;
  }

  function clearDisplay() {
    display.innerText = "0";
  }

  function calculate() {
    try {
      display.innerText = eval(display.innerText);
    } catch {
      display.innerText = "Error";
    }
  }
</script>

</body>
</html>
