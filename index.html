<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Calculator 💗</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffe6f0, #ffd6e8);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
  }

  /* floating flowers */
  .flower {
    position: absolute;
    font-size: 28px;
    animation: float 8s infinite;
    opacity: 0.6;
  }

  @keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-120vh); }
  }

  .calculator {
    width: 360px;
    padding: 30px;
    border-radius: 35px;
    background: #ffeef6;
    box-shadow:
      12px 12px 25px #e6c9d8,
      -12px -12px 25px #ffffff;
    text-align: center;
  }

  .title {
    font-family: 'Pacifico', cursive;
    font-size: 30px;
    color: #ff4f8b;
    margin-bottom: 14px;
  }

  .display {
    width: 100%;
    height: 70px;
    border-radius: 20px;
    margin-bottom: 22px;
    background: #ffeef6;
    box-shadow:
      inset 6px 6px 12px #e6c9d8,
      inset -6px -6px 12px #ffffff;
    font-size: 30px;
    color: #ff4f8b;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 18px;
    box-sizing: border-box;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  button {
    height: 64px;
    border-radius: 20px;
    border: none;
    font-size: 22px;
    font-weight: 600;
    background: #ffeef6;
    color: #ff4f8b;
    cursor: pointer;
    box-shadow:
      6px 6px 12px #e6c9d8,
      -6px -6px 12px #ffffff;
    transition: all 0.15s ease;
    position: relative;
  }

  button:active {
    box-shadow:
      inset 6px 6px 12px #e6c9d8,
      inset -6px -6px 12px #ffffff;
    transform: scale(0.96);
  }

  .operator {
    background: #ffd6e8;
  }

  .equal {
    grid-column: span 2;
    background: linear-gradient(45deg, #ff4f8b, #ff7bb0);
    color: white;
  }

  .clear {
    grid-column: span 2;
    background: #fff;
    color: #ff4f8b;
  }

  /* tiny flower on buttons */
  button::after {
    content: "🌸";
    position: absolute;
    font-size: 10px;
    bottom: 6px;
    right: 8px;
    opacity: 0.4;
  }
</style>
</head>

<body>

<!-- floating flowers -->
<script>
  for (let i = 0; i < 12; i++) {
    const f = document.createElement("div");
    f.className = "flower";
    f.innerHTML = Math.random() > 0.5 ? "🌸" : "💗";
    f.style.left = Math.random() * 100 + "vw";
    f.style.animationDuration = (6 + Math.random() * 4) + "s";
    document.body.appendChild(f);
  }
</script>

<div class="calculator">
  <div class="title">Cute Calculator 💕</div>
  <div class="display" id="display">0</div>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="append('/')">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('*')">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('-')">−</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let display = document.getElementById("display");
  let current = "";

  function append(val) {
    if (current === "0") current = "";
    current += val;
    display.innerText = current;
  }

  function clearDisplay() {
    current = "";
    display.innerText = "0";
  }

  function calculate() {
    try {
      current = eval(current).toString();
      display.innerText = current;
    } catch {
      display.innerText = "Oops 💔";
      current = "";
    }
  }
</script>

</body>
</html>
