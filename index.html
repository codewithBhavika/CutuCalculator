<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marshmallow Calculator 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(180deg, #ffe8f0, #ffdbe8);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
  }

  /* CARD */
  .calculator {
    width: 300px;
    background: #fff7fb;
    border-radius: 30px;
    padding: 22px;
    box-shadow:
      0 30px 60px rgba(255, 105, 180, 0.35),
      inset 0 2px 3px rgba(255,255,255,0.9);
  }

  .title {
    font-family: 'Pacifico', cursive;
    text-align: center;
    font-size: 24px;
    color: #ff5f9e;
    margin-bottom: 12px;
  }

  /* DISPLAY */
  .display {
    height: 56px;
    background: #fff;
    border-radius: 16px;
    margin-bottom: 16px;
    padding: 12px 16px;
    font-size: 24px;
    color: #ff5f9e;
    text-align: right;
    box-shadow:
      inset 4px 4px 8px rgba(0,0,0,0.08),
      inset -4px -4px 8px rgba(255,255,255,0.95);
  }

  /* BUTTON GRID */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  /* MARSHMALLOW BUTTON */
  button {
    height: 52px;
    border-radius: 18px;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #ff5f9e;
    background: #fff;
    box-shadow:
      6px 6px 14px rgba(0,0,0,0.12),
      -6px -6px 14px rgba(255,255,255,0.95);
    transition: all 0.15s ease;
  }

  button:active {
    transform: scale(0.94);
    box-shadow:
      inset 4px 4px 8px rgba(0,0,0,0.15),
      inset -4px -4px 8px rgba(255,255,255,0.9);
  }

  /* OPERATORS */
  .operator {
    background: #ffe3ee;
    font-weight: 600;
  }

  /* CLEAR */
  .clear {
    grid-column: span 2;
    background: #fff;
    font-weight: 600;
  }

  /* EQUAL */
  .equal {
    grid-column: span 2;
    background: linear-gradient(135deg, #ff5f9e, #ff85b3);
    color: white;
    font-size: 20px;
    box-shadow: 0 10px 20px rgba(255,95,158,0.45);
  }
</style>
</head>

<body>

<div class="calculator">
  <div class="title">Cute Calculator 💕</div>

  <div class="display" id="display">0</div>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="append('/')">÷</button>
    <button class="operator" onclick="append('*')">×</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('-')">−</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('.')">.</button>

    <button onclick="append('0')">0</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById("display");

  function append(value) {
    display.innerText === "0"
      ? display.innerText = value
      : display.innerText += value;
  }

  function clearDisplay() {
    display.innerText = "0";
  }

  function calculate() {
    try {
      display.innerText = eval(display.innerText);
    } catch {
      display.innerText = "Error";
    }
  }
</script>

</body>
</html>
