<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Calculator 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffeaf1, #fff3f7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
  }

  .calculator {
    width: 340px;
    background: linear-gradient(145deg, #ffe6ef, #ffd6e6);
    border-radius: 34px;
    padding: 26px;
    box-shadow:
      0 25px 45px rgba(255,105,180,0.28),
      inset 0 2px 4px rgba(255,255,255,0.7);
  }

  .title {
    font-family: 'Pacifico', cursive;
    font-size: 28px;
    color: #ff4f8b;
    text-align: center;
    margin-bottom: 14px;
  }

  .display {
    height: 64px;
    background: #ffeef5;
    border-radius: 18px;
    margin-bottom: 18px;
    padding: 14px 18px;
    font-size: 26px;
    text-align: right;
    color: #ff4f8b;
    box-shadow: inset 6px 6px 12px rgba(0,0,0,0.06),
                inset -6px -6px 12px rgba(255,255,255,0.9);
    overflow-x: auto;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  button {
    height: 58px;
    border-radius: 18px;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #ff4f8b;
    background: #ffeef5;
    box-shadow:
      6px 6px 12px rgba(0,0,0,0.08),
      -6px -6px 12px rgba(255,255,255,0.9);
    transition: transform 0.1s ease;
  }

  button:active {
    transform: scale(0.95);
  }

  .operator {
    background: #ffd1e3;
    font-weight: 600;
  }

  .equal {
    grid-column: span 2;
    background: linear-gradient(135deg, #ff4f8b, #ff78a5);
    color: white;
    font-size: 22px;
  }

  .clear {
    grid-column: span 2;
    background: #fff;
    font-weight: 600;
  }
</style>
</head>

<body>

<div class="calculator">
  <div class="title">Cute Calculator 💕</div>

  <div class="display" id="display">0</div>

  <div class="buttons">
    <!-- Row 1 -->
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="operator" onclick="append('/')">÷</button>
    <button class="operator" onclick="append('*')">×</button>

    <!-- Row 2 -->
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('-')">−</button>

    <!-- Row 3 -->
    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('+')">+</button>

    <!-- Row 4 -->
    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('.')">.</button>

    <!-- Row 5 -->
    <button onclick="append('0')">0</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById("display");

  function append(value) {
    if (display.innerText === "0") {
      display.innerText = value;
    } else {
      display.innerText += value;
    }
  }

  function clearDisplay() {
    display.innerText = "0";
  }

  function calculate() {
    try {
      display.innerText = eval(display.innerText);
    } catch {
      display.innerText = "Error";
    }
  }
</script>

</body>
</html>
